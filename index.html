<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MA1 Quiz Practice</title>
<meta name="description" content="Practice quizzes for NYIM MA1 (Intro to Massage), weighted toward the facts flagged on the slides, with a cumulative mode.">
<meta name="theme-color" content="#2b5c8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MA1 Quiz">
<style>html,body{margin:0}
:root{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* Layout: one narrow column, one card per screen, built for a phone between classes. */
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#dce3ea;
  --accent:#2b5c8a; --accent-ink:#ffffff; --accent-soft:#e3edf6;
  --star:#9a5b00; --star-soft:#fbefd9;
  --ok:#15803d; --ok-soft:#e5f5ea; --bad:#b91c1c; --bad-soft:#fbe9e9;
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --card:#18202a; --ink:#e6edf4; --muted:#97a6b6; --line:#2a3542;
    --accent:#7fb3e6; --accent-ink:#0b1a29; --accent-soft:#1a2c3f;
    --star:#f2b75b; --star-soft:#3a2a12;
    --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1b1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --card:#18202a; --ink:#e6edf4; --muted:#97a6b6; --line:#2a3542;
  --accent:#7fb3e6; --accent-ink:#0b1a29; --accent-soft:#1a2c3f;
  --star:#f2b75b; --star-soft:#3a2a12;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1b1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1{font-size:1.5rem;margin:8px 0 4px;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.1rem;margin:0 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;margin:10px 0 0;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;text-align:center}
.btn.ghost{background:transparent;text-align:center}
.btn:disabled{opacity:.5;cursor:default}
.opt:disabled{opacity:1}
.opt:disabled:not(.correct):not(.wrong){opacity:.6}
.btn .sub{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.btn.primary .sub{color:inherit;opacity:.85}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.progress > div{height:100%;background:var(--accent);width:0;transition:width .25s}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:99px}
.tag.star{color:var(--star);background:var(--star-soft)}
.prompt{font-size:1.15rem;font-weight:600;margin:0 0 6px}
.opt{position:relative;padding-left:48px}
.opt .key{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--card)}
.feedback{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--line)}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:4px}
.src{font-size:.85rem;color:var(--muted);margin-top:6px}
.score{font-size:3rem;font-weight:800;line-height:1;margin:8px 0;font-variant-numeric:tabular-nums}
.list{list-style:none;padding:0;margin:0}
.list li{padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.topicgrid .btn{margin-top:8px;min-height:48px;padding:10px 14px}
.num{display:inline-block;min-width:28px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.st{color:var(--star);font-weight:700}
.legend{display:flex;gap:8px;align-items:flex-start}
.section-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
footer{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.progress > div{transition:none}}
</style>
</head>
<body>

<main id="app"><p class="muted">Loading…</p></main>

<script>
"use strict";
const STORE_KEY = "ma1q-state-v2";
const OLD_KEY = "ma1q1-state-v1";
const QUIZ_LEN = 25, CUM_LEN = 40;
let DATA = null;          // {title, quizzes:[{id,title,lectures,blurb,sgNote,studyGuideTopics,topics,questions}]}
let QZ = {};              // id -> quiz (plus SG set and topic ids)
let state = loadState();  // {missed:{id:q}, best:{key:n}, runs:{key:n}}
let run = null;
let ctx = null;           // quiz id, "cum", or null

function loadState(){
  const blank = {missed:{}, best:{}, runs:{}};
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && typeof s==="object") return Object.assign(blank, s);
    const o = JSON.parse(localStorage.getItem(OLD_KEY));   // carry over Quiz #1 progress
    if(o && typeof o==="object"){
      for(const [k,q] of Object.entries(o.missed||{})){ const id="q1:"+k; blank.missed[id]=Object.assign({},q,{quiz:"q1",id}); }
      if(o.best!==null && o.best!==undefined) blank.best["q1:practice"]=o.best;
      if(o.runs) blank.runs["q1:practice"]=o.runs;
    }
  }catch(e){}
  return blank;
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

const rand = n => Math.floor(Math.random()*n);
const pick = arr => arr[rand(arr.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const order = () => DATA.quizzes.map(z=>z.id);
const short = qz => QZ[qz].title.replace("MA1 ","");

/* ---------- Weighting ----------
   Study-guide topic with flagged slide content: 10
   Study-guide topic:                           3
   Extra slide topic with flagged content:      3
   Extra slide topic:                           1
   Inside a topic, a flagged question is drawn 75% of the time when the topic has one. */
const byTopic = (qz,t) => QZ[qz].questions.filter(q=>q.topic===t);
const topicFlagged = (qz,t) => byTopic(qz,t).some(q=>q.f);
function topicWeight(qz,t){ const f=topicFlagged(qz,t); return QZ[qz].SG.has(t) ? (f?10:3) : (f?3:1); }

function weightedSample(items, weightOf, k){
  // Efraimidis-Spirakis: key = u^(1/w), keep the k largest
  return items.map(it=>({it, key: Math.pow(Math.random(), 1/weightOf(it))}))
              .sort((a,b)=>b.key-a.key).slice(0,k).map(x=>x.it);
}
function drawOne(qz,t){
  const pool = byTopic(qz,t), flagged = pool.filter(q=>q.f), plain = pool.filter(q=>!q.f);
  if(flagged.length && (!plain.length || Math.random()<0.75)) return pick(flagged);
  return pick(plain);
}
function prepare(q){
  const opts = shuffle([q.a, ...q.w]);
  return Object.assign({}, q, {opts, correct: opts.indexOf(q.a)});
}
const slotSort = (a,b)=> order().indexOf(a[0])-order().indexOf(b[0]) || a[1]-b[1];
function buildPractice(qz){
  const topics = weightedSample(QZ[qz].ids, t=>topicWeight(qz,t), QUIZ_LEN).sort((a,b)=>a-b);
  return topics.map(t=>prepare(drawOne(qz,t)));
}
function buildDrill(qz,t){ return shuffle(byTopic(qz,t)).map(prepare); }
function buildFlagged(scope){
  const zs = scope==="cum" ? order() : [scope];
  return shuffle(zs.flatMap(z=>QZ[z].questions.filter(q=>q.f))).map(prepare);
}
function buildCumMix(n){
  const slots = DATA.quizzes.flatMap(z=>z.ids.map(t=>[z.id,t]));
  return weightedSample(slots, ([z,t])=>topicWeight(z,t), n).sort(slotSort).map(([z,t])=>prepare(drawOne(z,t)));
}
function buildCumFull(){
  return DATA.quizzes.flatMap(z=>z.studyGuideTopics.map(t=>prepare(drawOne(z.id,t))));
}
const missedFor = scope => Object.values(state.missed).filter(q=> scope==="cum" || q.quiz===scope);
function buildMissed(scope){
  return missedFor(scope).sort((a,b)=> order().indexOf(a.quiz)-order().indexOf(b.quiz) || a.topic-b.topic).map(prepare);
}

/* ---------- Screens ---------- */
const app = $("app");
function render(html){ app.innerHTML = html; window.scrollTo(0,0); }
function setHash(h){ if(location.hash!=="#"+h) history.replaceState(null,"","#"+h); }
const stat = (key,of) => (state.best[key]!==undefined ? `Best: <b>${state.best[key]}/${of}</b> · ` : "") + `Taken: <b>${state.runs[key]||0}</b>`;

function chooser(){
  ctx=null;
  history.replaceState(null,"",location.pathname);
  const totalQ = DATA.quizzes.reduce((n,z)=>n+z.questions.length,0);
  const cards = DATA.quizzes.slice().reverse().map((z,i)=>`
    <button class="btn ${i===0?"primary":""}" data-q="${z.id}">${esc(z.title)}<span class="sub">${esc(z.lectures)} · ${esc(z.blurb)}</span></button>`).join("");
  render(`
    <h1>MA1 Quiz Practice</h1>
    <p class="muted">Intro to Massage. Pick a quiz, or practice everything so far. Quizzes are cumulative, so mix in the older material too.</p>
    ${cards}
    <button class="btn" data-q="cum">Cumulative practice<span class="sub">${DATA.quizzes.map(z=>esc(short(z.id))).join(" + ")} · ${totalQ} questions</span></button>
    <div class="card small">
      <div class="legend"><span class="st">★</span><span class="muted">Flagged = the point is starred, in red, highlighted, underlined or set apart on the lecture slide (or the handout says "Quiz material"). Those topics come up about twice as often.</span></div>
    </div>
    <footer>Unofficial study aid based on the NYIM MA1 slides, handouts, study guides and the Salvo textbook. Progress is saved only on this device.<br>
      <button class="linkbtn small" id="reset">Reset my progress</button></footer>
  `);
  app.querySelectorAll("[data-q]").forEach(b=> b.onclick = ()=> b.dataset.q==="cum" ? cumHome() : quizHome(b.dataset.q));
  $("reset").onclick = ()=>{ if(confirmReset()){ state={missed:{},best:{},runs:{}}; saveState(); chooser(); } };
}
let resetArmed=false;
function confirmReset(){
  const b=$("reset");
  if(!resetArmed){ resetArmed=true; b.textContent="Tap again to confirm reset"; setTimeout(()=>{resetArmed=false; if(b.isConnected) b.textContent="Reset my progress";},3000); return false; }
  resetArmed=false; return true;
}

function quizHome(qz){
  ctx=qz; setHash(qz);
  const z=QZ[qz], m=missedFor(qz).length, fl=z.questions.filter(q=>q.f).length;
  render(`
    <div class="topbar"><button class="linkbtn" id="back">‹ All quizzes</button></div>
    <h1>${esc(z.title)} Practice</h1>
    <p class="muted">${esc(z.lectures)}: ${esc(z.blurb)} A new random set every time, in study-guide order.</p>
    <button class="btn primary" id="go">Start practice quiz<span class="sub">${QUIZ_LEN} questions · weighted toward flagged slides</span></button>
    <button class="btn" id="flag"><span class="st">★</span> Flagged facts only<span class="sub">All ${fl} questions on starred, red or highlighted points</span></button>
    <button class="btn" id="drill">Drill one topic<span class="sub">Every question for a single study-guide item</span></button>
    <button class="btn" id="missed" ${m?"":"disabled"}>Review missed questions<span class="sub">${m?m+" saved to retry":"Nothing missed yet"}</span></button>
    <div class="card small muted">${stat(qz+":practice",QUIZ_LEN)}<br>
      Question bank: ${z.questions.length} questions across ${z.ids.length} topics.</div>
  `);
  $("back").onclick = chooser;
  $("go").onclick = ()=>start({mode:"practice", scope:qz}, buildPractice(qz));
  $("flag").onclick = ()=>start({mode:"flagged", scope:qz}, buildFlagged(qz));
  $("drill").onclick = ()=>topicPicker(qz);
  $("missed").onclick = ()=>start({mode:"missed", scope:qz}, buildMissed(qz));
}

function cumHome(){
  ctx="cum"; setHash("cumulative");
  const m=missedFor("cum").length, sgTotal=DATA.quizzes.reduce((n,z)=>n+z.studyGuideTopics.length,0);
  const fl=DATA.quizzes.reduce((n,z)=>n+z.questions.filter(q=>q.f).length,0);
  render(`
    <div class="topbar"><button class="linkbtn" id="back">‹ All quizzes</button></div>
    <h1>Cumulative practice</h1>
    <p class="muted">Everything so far: ${DATA.quizzes.map(z=>esc(z.title)+" ("+esc(z.lectures)+")").join(", ")}. Quizzes are cumulative, and this covers the final too.</p>
    <button class="btn primary" id="mix">Cumulative quiz<span class="sub">${CUM_LEN} questions from all quizzes · weighted toward flagged slides</span></button>
    <button class="btn" id="full">Full cumulative<span class="sub">${sgTotal} questions · one per study-guide item from every quiz</span></button>
    <button class="btn" id="flag"><span class="st">★</span> Flagged facts, all quizzes<span class="sub">All ${fl} flagged questions, shuffled</span></button>
    <button class="btn" id="missed" ${m?"":"disabled"}>Review all missed<span class="sub">${m?m+" saved across all quizzes":"Nothing missed yet"}</span></button>
    <div class="card small muted">Cumulative quiz: ${stat("cum:mix",CUM_LEN)}<br>Full cumulative: ${stat("cum:full",sgTotal)}</div>
  `);
  $("back").onclick = chooser;
  $("mix").onclick = ()=>start({mode:"mix", scope:"cum"}, buildCumMix(CUM_LEN));
  $("full").onclick = ()=>start({mode:"full", scope:"cum"}, buildCumFull());
  $("flag").onclick = ()=>start({mode:"flagged", scope:"cum"}, buildFlagged("cum"));
  $("missed").onclick = ()=>start({mode:"missed", scope:"cum"}, buildMissed("cum"));
}

function topicButton(qz,t){
  return `<button class="btn" data-t="${t}"><span class="num">${t}.</span> ${esc(QZ[qz].topics[t])}${topicFlagged(qz,t)?' <span class="st" aria-label="flagged">★</span>':''}</button>`;
}
function topicPicker(qz){
  const z=QZ[qz];
  const sg = z.ids.filter(t=>z.SG.has(t)).map(t=>topicButton(qz,t)).join("");
  const extra = z.ids.filter(t=>!z.SG.has(t)).map(t=>topicButton(qz,t)).join("");
  render(`
    <div class="topbar"><button class="linkbtn" id="back">‹ ${esc(z.title)}</button></div>
    <h1>Drill one topic</h1>
    <p class="muted">${esc(z.sgNote)} <span class="st">★</span> = has flagged slide content.</p>
    <p class="section-label">Study guide</p>
    <div class="topicgrid">${sg}</div>
    ${extra?`<p class="section-label">Also on the slides and handouts</p><div class="topicgrid">${extra}</div>`:""}
  `);
  $("back").onclick = ()=>quizHome(qz);
  app.querySelectorAll("[data-t]").forEach(b=> b.onclick = ()=> start({mode:"drill", scope:qz, topic:+b.dataset.t}, buildDrill(qz,+b.dataset.t)));
}

function goBack(){ if(ctx==="cum") cumHome(); else if(ctx) quizHome(ctx); else chooser(); }

function start(opts, list){
  if(!list.length){ goBack(); return; }
  run = Object.assign({list, i:0, score:0, answered:false, wrong:[]}, opts);
  question();
}

function question(){
  const q = run.list[run.i], z = QZ[q.quiz];
  const pct = Math.round(run.i/run.list.length*100);
  const keys = "ABCD";
  const qtag = run.scope==="cum" || run.mode==="missed" ? `${esc(short(q.quiz))} · ` : "";
  render(`
    <div class="topbar">
      <button class="linkbtn" id="quit">‹ Quit</button>
      <span class="small muted">Question ${run.i+1} of ${run.list.length} · Score ${run.score}</span>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="tags"><span class="tag">${qtag}${z.SG.has(q.topic)?"Study guide "+q.topic:"Slides"} · ${esc(z.topics[q.topic])}</span>${q.f?'<span class="tag star">★ Flagged</span>':''}</div>
    <p class="prompt">${esc(q.q)}</p>
    <div id="opts">${q.opts.map((o,i)=>`<button class="btn opt" data-i="${i}"><span class="key">${keys[i]}</span>${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div>
  `);
  $("quit").onclick = ()=>{ run=null; goBack(); };
  run.answered=false;
  app.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> answer(+b.dataset.i));
}

function answer(i){
  if(run.answered) return; run.answered=true;
  const q = run.list[run.i];
  const ok = i===q.correct;
  app.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===q.correct) b.classList.add("correct"); else if(j===i) b.classList.add("wrong"); });
  const saved = {quiz:q.quiz,topic:q.topic,q:q.q,a:q.a,w:q.w,e:q.e,s:q.s,f:q.f,id:q.id};
  if(ok){ run.score++; delete state.missed[q.id]; }
  else { run.wrong.push(q); state.missed[q.id]=saved; }
  saveState();
  const last = run.i===run.list.length-1;
  $("fb").innerHTML = `
    <div class="feedback ${ok?"ok":"bad"}">
      <b>${ok?"Correct!":"Not quite. Answer: "+esc(q.a)}</b>
      ${esc(q.e)}
      <div class="src">Source: ${esc(q.s)}</div>
    </div>
    <button class="btn primary" id="next">${last?"See results":"Next question"}</button>`;
  $("next").onclick = ()=>{ if(last) results(); else { run.i++; question(); } };
  $("next").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function rebuild(r){
  if(r.mode==="practice") return buildPractice(r.scope);
  if(r.mode==="flagged") return buildFlagged(r.scope);
  if(r.mode==="drill") return buildDrill(r.scope, r.topic);
  if(r.mode==="mix") return buildCumMix(CUM_LEN);
  if(r.mode==="full") return buildCumFull();
  return buildMissed(r.scope);
}

function results(){
  const total = run.list.length, s = run.score;
  const key = run.scope==="cum" ? ((run.mode==="mix"||run.mode==="full") ? "cum:"+run.mode : null) : (run.mode==="practice" ? run.scope+":practice" : null);
  if(key){ state.runs[key]=(state.runs[key]||0)+1; if(state.best[key]===undefined || s>state.best[key]) state.best[key]=s; saveState(); }
  const pct = Math.round(s/total*100);
  const fl = run.list.filter(q=>q.f), flOk = fl.filter(q=>!run.wrong.includes(q)).length;
  const msg = pct>=90?"Excellent, you're ready.":pct>=75?"Solid. Review the misses below.":pct>=60?"Getting there. Drill the topics you missed.":"Keep going. Drill topic by topic.";
  let byQuiz = "";
  if(run.scope==="cum" && run.mode!=="flagged"){
    byQuiz = order().map(z=>{ const l=run.list.filter(q=>q.quiz===z); if(!l.length) return ""; const ok=l.filter(q=>!run.wrong.includes(q)).length; return `${esc(short(z))}: ${ok}/${l.length}`; }).filter(Boolean).join(" · ");
  }
  const missedList = run.wrong.map(q=>`<li><span class="num">${q.topic}.</span> ${q.f?'<span class="st">★</span> ':''}${esc(q.q)}<br><span class="small">Answer: <b>${esc(q.a)}</b> · <span class="muted">${run.scope==="cum"||run.mode==="missed"?esc(short(q.quiz))+", ":""}${esc(q.s)}</span></span></li>`).join("");
  const again = {practice:"New random quiz", flagged:"Go again", drill:"Drill again", mix:"New cumulative quiz", full:"New full cumulative", missed:"Go again"}[run.mode];
  render(`
    <h1>Results</h1>
    <div class="card" style="text-align:center">
      <div class="score">${s}/${total}</div>
      <div class="muted">${pct}% · ${msg}</div>
      ${byQuiz?`<div class="small muted" style="margin-top:8px">${byQuiz}</div>`:""}
      ${fl.length && run.mode!=="flagged"?`<div class="small muted" style="margin-top:8px"><span class="st">★</span> Flagged questions: ${flOk}/${fl.length}</div>`:""}
    </div>
    <button class="btn primary" id="again">${again}</button>
    ${run.wrong.length?`<button class="btn" id="retry">Retry the ${run.wrong.length} I missed</button>`:""}
    <button class="btn ghost" id="home">Back</button>
    ${run.wrong.length?`<div class="card"><h2>Missed questions</h2><ul class="list">${missedList}</ul></div>`:""}
  `);
  const r = Object.assign({}, run), wrong = run.wrong.slice();
  $("again").onclick = ()=> start({mode:r.mode, scope:r.scope, topic:r.topic}, rebuild(r));
  if(wrong.length) $("retry").onclick = ()=> start({mode:"missed", scope:r.scope}, shuffle(wrong).map(prepare));
  $("home").onclick = goBack;
}

/* ---------- Boot ---------- */
function route(){
  const h = location.hash.replace("#","");
  if(h==="cumulative") cumHome(); else if(QZ[h]) quizHome(h); else chooser();
}
fetch("questions.json", {cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(data=>{
    data.quizzes.forEach(z=>{
      z.questions.forEach((q,i)=>{ q.quiz = z.id; q.id = z.id+":q"+i+":"+q.q.slice(0,40); });
      z.SG = new Set(z.studyGuideTopics);
      z.ids = Object.keys(z.topics).map(Number).sort((a,b)=>a-b);
      QZ[z.id] = z;
    });
    DATA = data; route();
    window.addEventListener("hashchange", ()=>{ run=null; route(); });
  })
  .catch(()=>{ app.innerHTML = '<div class="card">Could not load the questions. Check your connection and refresh.</div>'; });

if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
